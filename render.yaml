# Public-only Render static site. Manually review copy, costs and exact rules before linking.
# The private adult service and database are NOT created by this Blueprint.
# Generated by scripts/generate_render_routes.py; never use a /* rewrite.
services:
  - type: web
    name: desloop-readonly-guide
    runtime: static
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: npm ci --ignore-scripts && npm run build:render-public
    staticPublishPath: ./dist/render-public
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
      - path: /release.json
        name: Cache-Control
        value: no-store
    # Domain root is served directly by index.html. Other pages have exact rewrites.
    routes:
      - type: rewrite
        source: /courses
        destination: /index.html
      - type: rewrite
        source: /how-it-works
        destination: /index.html
      - type: rewrite
        source: /availability
        destination: /index.html
